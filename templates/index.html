<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adjectives</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link 
        id="theme-style"
        rel="stylesheet"
        href="{{ url_for('static', filename='lightmode.css') }}">

    <!-- Load script.js early so it can fix the theme before paint -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
  
<body>

  <!-- ── HEADER ─────────────────────────────────── -->
  <header class="site-header" id="site-header">
    <span class="site-header__title">Adjective Collector</span>

    <div class="theme-toggle" onclick="toggleTheme()" title="Switch theme">
      <span class="theme-toggle__label" id="toggle-label">Light</span>
      <div class="theme-toggle__track" id="toggle-track">
        <div class="theme-toggle__thumb">
          <span class="theme-toggle__icon theme-toggle__icon--sun">&#9728;</span>
          <span class="theme-toggle__icon theme-toggle__icon--moon">&#9789;</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ── MAIN CARD ──────────────────────────────── -->
  <div class="main_card">
    <div class="margin_container">

      <form action="/" method="post">
          <label for="adjective">Adjective:</label>
          <input type="text" id="adjective" name="adjective" placeholder="e.g. luminous">
          <button type="submit"><span>Add &rarr;</span></button>
      </form>

      <h2 class="text">Thank you &mdash; here are some other things that were said about this website:</h2>

      <figure class="wordcloud-frame">
        <img id="wordcloud" src="{{ url_for('static', filename='images/cloud_light.png') }}"
          alt="Wordcloud of the adjectives">
        <figcaption>collected adjectives</figcaption>
      </figure>

    </div>
  </div>

</body>
</html>
